<meta charset="utf-8">
<title>saucer launcher spike</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none; color: #dfe6f2;
  }
  body {
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding-bottom: 24px; box-sizing: border-box;
  }
  .column { width: 700px; }
  .panel {
    background: rgba(18, 22, 30, 0.9);
    border: 1px solid rgba(120, 140, 180, 0.28);
    border-radius: 16px; padding: 14px 18px; margin-bottom: 10px;
    font-size: 12px; line-height: 1.7;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(18px);
  }
  .panel b { color: #8fb8ff; font-weight: 600; }
  .ok { color: #58d1a0; }
  .bad { color: #ff7b7b; }
  .bar {
    height: 52px; border-radius: 26px;
    display: flex; align-items: center; padding: 0 18px; gap: 12px;
    background: rgba(22, 26, 34, 0.86);
    border: 1px solid rgba(120, 140, 180, 0.28);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(18px); font-size: 13px;
  }
  .bar:hover { border-color: rgba(120, 220, 180, 0.8); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #58d1a0; box-shadow: 0 0 10px #58d1a0; }
  #stream { margin-left: auto; font-size: 11px; opacity: 0.8; }
</style>

<div class="column">
  <div class="panel" id="out" data-interactive>starting…</div>
  <div class="bar" data-interactive>
    <span class="dot"></span>
    <span>saucer + node sidecar</span>
    <span id="stream">stream: —</span>
  </div>
</div>

<script>
  // ─── Bridge ───
  //
  // Reconstructs a promise-returning IPC API on top of a one-way pair: requests
  // go out through saucer's exposed function, replies and pushed events come
  // back when C++ calls window.__bridgeReceive. This is the same contract the
  // renderer already has with Electron's ipcRenderer.invoke plus its on(...)
  // listeners, so porting the real preload means re-pointing ~65 methods at
  // invoke() rather than rewriting call sites.
  const pending = new Map()
  const listeners = new Map()
  let nextId = 1

  function invoke(channel, args = {}) {
    const id = nextId++
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject })
      window.saucer.exposed.bridge_send(JSON.stringify({ id, channel, args }))
      setTimeout(() => {
        if (pending.delete(id)) reject(new Error(`timeout: ${channel}`))
      }, 5000)
    })
  }

  function on(event, fn) {
    if (!listeners.has(event)) listeners.set(event, new Set())
    listeners.get(event).add(fn)
    return () => listeners.get(event).delete(fn)
  }

  window.__bridgeReceive = (raw) => {
    // C++ hands the line over as a string argument rather than splicing it into
    // the script, so escaping is the serializer's problem and JSON braces can
    // never be mistaken for format specifiers.
    let msg
    try {
      msg = typeof raw === 'string' ? JSON.parse(raw) : raw
    } catch {
      return
    }
    if (msg && msg.event) {
      for (const fn of listeners.get(msg.event) ?? []) fn(msg.payload)
      return
    }
    const p = pending.get(msg.id)
    if (!p) return
    pending.delete(msg.id)
    msg.ok ? p.resolve(msg.result) : p.reject(new Error(msg.error))
  }

  // ─── Click-through hit rects (C++ polls the cursor against these) ───
  function publishRects() {
    const flat = []
    for (const el of document.querySelectorAll('[data-interactive]')) {
      const r = el.getBoundingClientRect()
      flat.push(Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height))
    }
    window.saucer?.exposed?.set_hit_rects?.(flat)
  }
  addEventListener('resize', publishRects)
  new ResizeObserver(publishRects).observe(document.querySelector('.column'))

  // ─── Exercise every message shape the real app needs ───
  const out = document.getElementById('out')
  const lines = []
  const say = (html) => { lines.push(html); out.innerHTML = lines.join('<br>'); publishRects() }

  on('sidecar:ready', (p) => say(`<b>push</b> sidecar:ready — node ${p.nodeVersion} <span class="ok">✓</span>`))

  let progress = 0
  on('demo:progress', (p) => {
    progress++
    document.getElementById('stream').textContent = `stream: ${p.step}/${p.of}`
  })
  on('demo:done', (p) => say(`<b>stream</b> ${progress} progress events + done <span class="ok">✓</span>`))

  ;(async () => {
    try {
      say(`<b>sync</b> ping → ${await invoke('ping')} <span class="ok">✓</span>`)

      const info = await invoke('getStaticInfo')
      say(`<b>request</b> getStaticInfo → node ${info.nodeVersion}, pid ${info.pid} <span class="ok">✓</span>`)

      const t0 = performance.now()
      const echo = await invoke('slowEcho', { text: 'hello', delayMs: 200 })
      say(`<b>async</b> slowEcho → "${echo}" in ${Math.round(performance.now() - t0)}ms <span class="ok">✓</span>`)

      await invoke('runDemo', { steps: 4 })
      say(`<b>streaming</b> runDemo accepted, watching pushes…`)

      try {
        await invoke('nope')
      } catch (err) {
        say(`<b>error path</b> ${err.message} <span class="ok">✓</span>`)
      }
    } catch (err) {
      say(`<span class="bad">FAILED: ${err.message}</span>`)
    }
  })()

  publishRects()
</script>
