<meta charset="utf-8">
<title>saucer launcher spike</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding-bottom: 24px; box-sizing: border-box;
  }
  .column { width: 700px; }
  .bar {
    height: 52px; border-radius: 26px;
    display: flex; align-items: center; padding: 0 18px; gap: 12px;
    background: rgba(22, 26, 34, 0.86);
    border: 1px solid rgba(120, 140, 180, 0.28);
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(18px);
    color: #dfe6f2; font-size: 13px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #58d1a0; box-shadow: 0 0 10px #58d1a0; }
  .probe {
    width: 160px; height: 26px; margin: 0 auto 10px; border-radius: 13px;
    background: repeating-linear-gradient(45deg,
      rgba(255,80,80,0.85) 0 8px, rgba(80,140,255,0.85) 8px 16px);
  }
  .bar:hover { border-color: rgba(120, 220, 180, 0.8); }
  #state { margin-left: auto; font-size: 11px; opacity: 0.75; }
</style>

<div class="column">
  <div class="probe"></div>
  <div class="bar" data-interactive>
    <span class="dot"></span>
    <span>saucer spike — hover the bar, it should highlight</span>
    <span id="state">rects: —</span>
  </div>
</div>

<script>
  // Publish the interactive rectangles to C++, which does the hit-testing.
  //
  // The page deliberately does NOT listen for mousemove to drive click-through:
  // that is exactly what cannot work here, because once click-through is on
  // saucer delivers no pointer events at all. Instead C++ polls the cursor and
  // toggles click-through against these rects, so the page only has to say
  // where it wants to be interactive — which it knows from layout, not input.
  const call = (name, ...args) => window.saucer?.exposed?.[name]?.(...args)

  function publish() {
    const flat = []
    for (const el of document.querySelectorAll('[data-interactive]')) {
      const r = el.getBoundingClientRect()
      flat.push(Math.round(r.x), Math.round(r.y), Math.round(r.width), Math.round(r.height))
    }
    call('set_hit_rects', flat)
    const s = document.getElementById('state')
    if (s) s.textContent = `rects: ${flat.length / 4}`
  }

  // Republish whenever layout could have moved them, and never per-frame.
  addEventListener('load', publish)
  addEventListener('resize', publish)
  new ResizeObserver(publish).observe(document.querySelector('.column'))
  publish()
</script>
