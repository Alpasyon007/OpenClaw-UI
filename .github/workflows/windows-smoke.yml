name: windows-smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The bundle guards in tests/contract/bundle.test.ts only run when
      # dist/renderer exists, so the build has to come before the tests.
      - name: Build renderer
        run: npm run build

      # The C++ shell needs CMake, the saucer dependencies and WebView2, so the
      # full `npm run dist` is not run here. This covers everything that is
      # JavaScript: the generated bridge must stay in step with the contract,
      # and the sidecar must actually bundle.
      - name: Check committed generated artefacts
        run: npm run check:generated

      - name: Test
        run: npm run coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/
          if-no-files-found: ignore
