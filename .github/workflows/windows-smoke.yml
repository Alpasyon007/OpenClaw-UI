name: windows-smoke

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build

      # The C++ shell needs CMake, the saucer dependencies and WebView2, so the
      # full `npm run dist` is not run here. These two cover everything that is
      # JavaScript: the generated bridge must stay in step with the contract,
      # and the sidecar must actually bundle.
      - name: Generate clui shim
        run: npm run shim

      - name: Bundle sidecar
        run: npm run sidecar
